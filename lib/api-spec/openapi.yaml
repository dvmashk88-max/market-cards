openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storefront
    description: Curated public storefront
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storefront/categories:
    get:
      operationId: storefrontCategories
      tags: [storefront]
      summary: List the four public storefront categories
      responses:
        "200":
          description: Storefront categories
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/StorefrontCategory"
  /storefront/products:
    get:
      operationId: storefrontProducts
      tags: [storefront]
      summary: List the nine curated storefront products with live offers
      responses:
        "200":
          description: Curated products
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/StorefrontProduct"
  /storefront/steam/quote:
    post:
      operationId: storefrontSteamQuote
      tags: [storefront]
      summary: Validate a Steam login and calculate a read-only top-up quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SteamQuoteInput"
      responses:
        "200":
          description: Final customer quote in RUB; no order is created
          content:
            application/json:
              schema:
                type: object
                required: [quote]
                properties:
                  quote:
                    $ref: "#/components/schemas/SteamQuote"
  /storefront/products/{slug}:
    get:
      operationId: storefrontProduct
      tags: [storefront]
      summary: Get one curated storefront product
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Curated product
          content:
            application/json:
              schema:
                type: object
                required: [product]
                properties:
                  product:
                    $ref: "#/components/schemas/StorefrontProduct"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    StorefrontCategoryId:
      type: string
      enum: [apple, steam, games, telegram]
    StorefrontCategory:
      type: object
      required: [id, name, emoji, order, productCount]
      properties:
        id:
          $ref: "#/components/schemas/StorefrontCategoryId"
        name:
          type: string
        emoji:
          type: string
        order:
          type: integer
        productCount:
          type: integer
    StorefrontOffer:
      type: object
      required: [id, label, nominal, priceRub, available, stock]
      properties:
        id:
          type: string
        label:
          type: string
        nominal:
          type: object
          required: [amount, currency]
          properties:
            amount:
              type: string
            currency:
              type: string
        priceRub:
          type: integer
          minimum: 1
        available:
          type: boolean
        stock:
          type: [integer, "null"]
    StorefrontProduct:
      type: object
      required:
        [
          slug,
          categoryId,
          title,
          description,
          flag,
          region,
          available,
          offers,
          steamForm,
        ]
      properties:
        slug:
          type: string
        categoryId:
          $ref: "#/components/schemas/StorefrontCategoryId"
        title:
          type: string
        description:
          type: string
        flag:
          type: string
        region:
          type: [string, "null"]
        available:
          type: boolean
        offers:
          type: array
          items:
            $ref: "#/components/schemas/StorefrontOffer"
        steamForm:
          oneOf:
            - $ref: "#/components/schemas/SteamFormConfig"
            - type: "null"
    SteamCurrency:
      type: string
      enum: [USD, RUB, UAH, KZT]
    SteamAmountRule:
      type: object
      required: [currency, maxFractionDigits]
      properties:
        currency:
          $ref: "#/components/schemas/SteamCurrency"
        maxFractionDigits:
          type: integer
    SteamFormConfig:
      type: object
      required: [currencies, amountRules, minimumAmount, maximumAmount]
      properties:
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/SteamCurrency"
        amountRules:
          type: array
          items:
            $ref: "#/components/schemas/SteamAmountRule"
        minimumAmount:
          type: "null"
        maximumAmount:
          type: "null"
    SteamQuoteInput:
      type: object
      required: [steamLogin, currency, amount]
      properties:
        steamLogin:
          type: string
          minLength: 1
          maxLength: 100
        currency:
          $ref: "#/components/schemas/SteamCurrency"
        amount:
          type: string
          minLength: 1
          maxLength: 32
    SteamQuote:
      type: object
      required: [canRefill, currency, amount, priceRub]
      properties:
        canRefill:
          type: boolean
          enum: [true]
        currency:
          $ref: "#/components/schemas/SteamCurrency"
        amount:
          type: string
        priceRub:
          type: integer
          minimum: 1
