# Keep Railway's Root Directory at the repository root. This storefront uses
# pnpm workspace dependencies and catalog entries defined at the root.

[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @workspace/antarctic-market run build && pnpm --filter @workspace/api-server run build && cmp artifacts/antarctic-market/public/robots.txt artifacts/api-server/dist/public/robots.txt && cmp artifacts/antarctic-market/public/sitemap.xml artifacts/api-server/dist/public/sitemap.xml && cmp artifacts/antarctic-market/public/google7f276c4349db7e40.html artifacts/api-server/dist/public/google7f276c4349db7e40.html"

[deploy]
startCommand = "cmp artifacts/antarctic-market/public/robots.txt artifacts/api-server/dist/public/robots.txt && cmp artifacts/antarctic-market/public/sitemap.xml artifacts/api-server/dist/public/sitemap.xml && cmp artifacts/antarctic-market/public/google7f276c4349db7e40.html artifacts/api-server/dist/public/google7f276c4349db7e40.html && pnpm --filter @workspace/db run migrate && NODE_ENV=production node artifacts/api-server/dist/index.mjs"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
