# Keep Railway's Root Directory at the repository root. This storefront uses
# pnpm workspace dependencies and catalog entries defined at the root.

[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @workspace/antarctic-market run build && pnpm --filter @workspace/api-server run build"

[deploy]
startCommand = "pnpm --filter @workspace/db run migrate && pnpm --filter @workspace/api-server run start"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
